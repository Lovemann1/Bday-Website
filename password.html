
<!DOCTYPE html>
<html>
<head>
    <title>Enter Password ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="birthday-card">

        <h1>🔐 Secret Surprise</h1>

        <h2>Only for you ❤️</h2>

        <p>Enter the secret password to unlock your surprise!</p>

        <input
            type="password"
            id="password"
            placeholder="Enter 4-digit password"
        >

        <br><br>

        <button onclick="checkPassword()">
            Unlock ❤️
        </button>
        <p id="message"></p>

    </div>

    <script>
        function checkPassword() {

            let enteredPassword =
                document.getElementById("password").value;
            /*  dakh liya password,karr ki cheeting 😒😒😒😒😒*/
            if (enteredPassword === "1127") {

                window.location.href = "surprise.html";

            }
            else if (enteredPassword === "2711") {
                document.getElementById("message").innerHTML =
                 "close😏 not that easy! again Tryyyyyy !";
            }
            else {

                document.getElementById("message").innerHTML =
                    "Oops! Wrong password. Tryyyyy again ❤️";
            }
        }
    </script>

</body>
</html>
